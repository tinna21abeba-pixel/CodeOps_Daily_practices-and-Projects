<!DOCTYPE html>
<html lang="en">
<head>

  <title>Habesha Eatery</title>
  <link rel="stylesheet" href="styles/homePage.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
