     <h1>Wellcome To Our Resturant</h1>
        <img src="resturant.png" alt="Habesha Eatery with its whole service"   width="100%" height="500px">
        <h1> Enjoy With Our  Delicious Ethiopian Foods</h1>


        <form action="" method="post">
             
          <p>
            <label for="name">Name</label>
          <input type="text" id="name"  name="name" placeholder="Enter your name" requiered>
          </p>

         <p>
             <label for="email">Email</label>
          <input type="email"  id="email" name="email" placeholder="Enter your email" required>
         </p>

          <p>
            <label for="phone"> Phone Number</label>
          <input type="tel" name="phone" id="phone" required>
          </p>

          <p>
            <label for="date"> Reservation Date</label>
          <input type="date" name="data" id="data" required>
          </p>

           <p>
         <label for="time ">Reservation Time</label>
          <input type="time" name="time" id="time">
           </p>
         
          <p>
            <label for="guests">Number of guests</label><br>
           <select name="guests" id="guests">
             <option value="1-2">1-2</option>
             <option value="3-4">3-4</option>
             <option value="5+">5+</option>
           </select>
          </p>

          <p>
             <label for="seating">Preferred Seating: </label><br>
           <select name="seating" id="seating">
            <option value="Indoor">Indoor</option>
            <option value="outdoor">Outdoor</option>
           </select>
          </p>


              <p>
            <label for="request">Special request</label>
           <textarea name="request" id="request"></textarea>
              </p>

        </form>
